# cpolar terminates public TLS; this gateway is host-loopback only.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Validate the existing password or session before serving the application.
    # The API issues a signed, HttpOnly browser cookie after a valid Basic login.
    location = /_browser_session {
      internal;
      proxy_pass http://pi-durable-verify-web-1:8080/api/info;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Upgrade "";
      proxy_set_header Connection "";
    }

    location ~ ^/(?:index\.html)?$ {
      auth_request /_browser_session;
      auth_request_set $browser_session_cookie $upstream_http_set_cookie;
      add_header Set-Cookie $browser_session_cookie always;
      add_header Cache-Control "no-store" always;
      proxy_pass http://pi-durable-verify-web-1:8080;
    }

    location / {
      proxy_pass http://pi-durable-verify-web-1:8080;
    }
  }
}
